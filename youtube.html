<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Live Chat Embedder</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .controls { margin-bottom: 20px; }
        input { width: 300px; padding: 8px; }
        button { padding: 8px 15px; cursor: pointer; }
        #chat-container { width: 400px; height: 600px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h2>Live Chat Embedder</h2>
    <div class="controls">
        <input type="text" id="videoUrl" placeholder="Paste YouTube URL or ID here...">
        <button onclick="loadChat()">Load Chat</button>
    </div>

    <div id="chat-container">
        <iframe id="chatFrame" width="100%" height="100%" frameborder="0"></iframe>
    </div>

    <script>
        function loadChat() {
            const input = document.getElementById('videoUrl').value;
            const iframe = document.getElementById('chatFrame');
            
            // Extract Video ID from URL (handles full URLs and raw IDs)
            const videoId = extractVideoID(input);
            
            if (videoId) {
                // IMPORTANT: 'embed_domain' must match the domain where this page is hosted.
                // For local testing, use 'localhost'.
                const embedUrl = `https://www.youtube.com/live_chat?v=${videoId}&embed_domain=localhost`;
                iframe.src = embedUrl;
            } else {
                alert("Please enter a valid YouTube URL or Video ID.");
            }
        }

        function extractVideoID(url) {
            // Regex to find video ID from common YouTube URL formats
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }
    </script>
</body>
</html>
