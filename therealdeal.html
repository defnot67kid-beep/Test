<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>RobloxPlus · Clickable Robux Icons</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}
body {
  background: #03030a;
  overflow-x: hidden;
  color: white;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #101d66 0%, #060611 45%, #020204 100%);
  z-index: -2;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px);
  background-size: 35px 35px;
  opacity: .25;
  z-index: -1;
}
.topbar {
  height: 76px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.06);
  backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(0,0,0,.35);
}
.left-top { display: flex; align-items: center; gap: 18px; }
.logo { font-size: 24px; font-weight: 900; }
.manage-btn {
  border: none;
  background: #111;
  color: white;
  border-radius: 14px;
  padding: 14px 20px;
  font-weight: 800;
  cursor: pointer;
}
.right-top { display: flex; align-items: center; gap: 12px; }
.profile-pill {
  background: #0f0f15;
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 999px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.profile-pill img { width: 42px; height: 42px; border-radius: 50%; }
.profile-name { font-weight: 700; }
.robux-pill {
  background: #0f0f15;
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 999px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 24px;
  font-weight: 900;
}
.robux-icon-img {
  width: 28px;
  height: 28px;
  object-fit: contain;
  cursor: pointer;
  transition: 0.1s;
}
.robux-icon-img:hover { transform: scale(1.05); }
.robux-placeholder {
  cursor: pointer;
  font-size: 24px;
  transition: 0.1s;
}
.robux-placeholder:hover { opacity: 0.7; }
.send-btn {
  border: none;
  background: #111;
  color: white;
  padding: 12px 22px;
  border-radius: 999px;
  font-weight: 800;
  cursor: pointer;
}
.hero { max-width: 1200px; margin: auto; padding: 80px 30px; }
.hero-wrap { display: flex; justify-content: space-between; align-items: center; gap: 50px; }
.big-text { font-size: 96px; font-weight: 900; line-height: .92; }
.glow-btn {
  border: none;
  background: linear-gradient(90deg, #5d77ff, #785cff);
  color: white;
  padding: 26px 70px;
  border-radius: 24px;
  font-size: 30px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 0 50px rgba(92,113,255,.5);
}
.card-area { margin-top: 70px; }
.card-label { margin-bottom: 18px; color: #b9b9b9; font-weight: 700; }
.main-card {
  max-width: 920px;
  border-radius: 28px;
  overflow: hidden;
  background: #090909;
  border: 1px solid rgba(255,255,255,.05);
}
.banner {
  height: 240px;
  background: linear-gradient(to bottom, transparent, rgba(0,0,0,.88)), url('https://images.unsplash.com/photo-1474302770737-173ee21bab63?q=80&w=1400');
  background-size: cover;
  position: relative;
}
.game-info {
  position: absolute;
  bottom: 22px;
  left: 22px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.game-info img { width: 74px; height: 74px; border-radius: 50%; }
.game-title { font-size: 30px; font-weight: 900; }
.game-sub { color: #aaa; margin-top: 5px; }
.pack {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 26px 30px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.pack-left { display: flex; align-items: center; gap: 16px; }
.robux-amount { font-size: 34px; font-weight: 900; }
.old { text-decoration: line-through; color: #777; font-size: 22px; }
.more { background: #1a1a1a; padding: 8px 14px; border-radius: 12px; font-size: 15px; color: #bbb; font-weight: 700; }
.price { background: #1d1d1d; padding: 16px 24px; border-radius: 14px; font-size: 24px; font-weight: 900; }
.sidebar {
  position: fixed;
  top: 0;
  left: -480px;
  width: 480px;
  height: 100vh;
  background: #090909;
  border-right: 1px solid rgba(255,255,255,.06);
  z-index: 200;
  transition: .35s;
  overflow-y: auto;
}
.sidebar.open { left: 0; }
.side-content { padding: 28px; }
.side-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.side-title { font-size: 42px; font-weight: 900; }
.close { font-size: 34px; cursor: pointer; color: #999; }
.panel {
  background: #111;
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 24px;
  border: 1px solid rgba(255,255,255,.05);
}
.panel h2 { font-size: 34px; margin-bottom: 20px; }
.label { display: block; color: #999; margin-top: 16px; margin-bottom: 10px; font-weight: 700; }
.input {
  width: 100%;
  background: black;
  border: none;
  outline: none;
  color: white;
  padding: 20px;
  border-radius: 16px;
  font-size: 22px;
}
.blue-btn {
  width: 100%;
  border: none;
  background: #5670ff;
  color: white;
  padding: 20px;
  border-radius: 18px;
  margin-top: 24px;
  font-size: 24px;
  font-weight: 900;
  cursor: pointer;
}
.friend-wrap { display: flex; gap: 12px; }
.add-btn {
  width: 120px;
  border: none;
  background: #5670ff;
  color: white;
  border-radius: 16px;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
}
.friend-list { margin-top: 20px; }
.friend {
  background: #171717;
  padding: 18px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.remove {
  border: none;
  background: #2d0b0b;
  color: #ff6a6a;
  padding: 10px 14px;
  border-radius: 10px;
  font-weight: 800;
  cursor: pointer;
}
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.send-picker-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 520px;
  max-width: 92%;
  background: #0b0b12;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 26px;
  z-index: 999;
  display: none;
  box-shadow: 0 40px 100px rgba(0,0,0,.7);
}
.send-top {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid rgba(255,255,255,.05);
}
.send-title { font-size: 20px; font-weight: 800; }
.send-top-right { display: flex; align-items: center; gap: 18px; }
.send-balance {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 800;
  background: #101015;
  padding: 6px 12px;
  border-radius: 40px;
}
.send-close {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #15151d;
  cursor: pointer;
  font-size: 20px;
}
.picker-content { padding: 24px 20px 28px; }
.picker-search {
  width: 100%;
  height: 58px;
  background: #0c0c14;
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 20px;
  padding: 0 20px;
  color: white;
  font-size: 18px;
  outline: none;
}
.picker-search:focus { border-color: #5670ff; }
.search-results {
  margin-top: 12px;
  max-height: 280px;
  overflow-y: auto;
  display: none;
  background: #08080c;
  border-radius: 20px;
}
.friends-title { margin-top: 28px; margin-bottom: 16px; font-size: 22px; font-weight: 800; }
.picker-friends {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 320px;
  overflow-y: auto;
}
.user-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  border-radius: 20px;
  background: #111118;
  cursor: pointer;
  transition: .18s;
}
.user-card:hover { background: #1a1a28; }
.user-card img { width: 52px; height: 52px; border-radius: 50%; }
.user-info { display: flex; flex-direction: column; }
.user-display { font-size: 17px; font-weight: 800; }
.user-handle { color: #8b8b98; font-size: 13px; margin-top: 4px; }
.send-black-screen {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 10000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.send-black-screen.show { display: flex; }
.black-container { width: 100%; max-width: 550px; }
.loaderRing {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  border: 8px solid #1b1b26;
  border-top: 8px solid #5670ff;
  margin: auto;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.amount-middle {
  background: #14141c;
  padding: 15px;
  border-radius: 60px;
  margin-bottom: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.amount-option {
  height: 55px;
  border-radius: 14px;
  border: none;
  background: #1f1f2a;
  color: white;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.1s;
}
.amount-option.active { background: #5670ff; }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="side-content">
    <div class="side-header">
      <div class="side-title">Manage Site</div>
      <div class="close" onclick="closeSidebar()">×</div>
    </div>
    <div class="panel">
      <h2>My Profile</h2>
      <label class="label">Username</label>
      <input class="input" id="usernameInput" value="stickmasterluke">
      <label class="label">Balance (Robux)</label>
      <input class="input" id="balanceInput" value="1859403">
      <button class="blue-btn" onclick="updateProfile()">Update Profile</button>
    </div>
    <div class="panel">
      <h2>Saved Friends</h2>
      <div class="friend-wrap">
        <input class="input" id="friendInput" placeholder="Username">
        <button class="add-btn" onclick="addFriend()">Add</button>
      </div>
      <div class="friend-list" id="friendList"></div>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="left-top">
    <button class="manage-btn" onclick="openSidebar()">MANAGE SITE</button>
    <div class="logo">RobloxPlus</div>
  </div>
  <div class="right-top">
    <div class="profile-pill">
      <img id="profileIcon" src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-3109B0E4C5F0D85B77E89A20A6B1E9B3-Png/150/150/AvatarHeadshot/Png/noFilter">
      <div class="profile-name" id="profileName">stickmasterluke</div>
    </div>
    <div class="robux-pill" id="robuxPill">
      <span id="robuxIconContainer">⏺</span>
      <span id="balanceText">1859403</span>
    </div>
    <button class="send-btn" id="mainSendBtn">Send</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-wrap">
    <div class="big-text">Enjoy up to<br>25%<br>more Robux</div>
    <button class="glow-btn" id="heroSendBtn">↑ Send Robux</button>
  </div>
  <div class="card-area">
    <div class="card-label">Bonus item we picked for you</div>
    <div class="main-card">
      <div class="banner">
        <div class="game-info">
          <img id="gameIcon" src="https://tr.rbxcdn.com/180DAY-e14c2f238f7b5cbfe8a5f4dbd3d70e6b/150/150/Image/Png/noFilter">
          <div><div class="game-title">War Tycoon</div><div class="game-sub">2X CASH</div></div>
        </div>
      </div>
      <div class="pack">
        <div class="pack-left">
          <span id="packageIcon1">⏺</span>
          <div class="robux-amount">24,000</div>
          <div class="old">22,500</div>
          <div class="more">+1500 more</div>
        </div>
        <div class="price">$199.99</div>
      </div>
      <div class="pack">
        <div class="pack-left">
          <span id="packageIcon2">⏺</span>
          <div class="robux-amount">11,000</div>
          <div class="old">10,000</div>
          <div class="more">+1000 more</div>
        </div>
        <div class="price">$99.99</div>
      </div>
      <div class="pack">
        <div class="pack-left">
          <span id="packageIcon3">⏺</span>
          <div class="robux-amount">5,250</div>
          <div class="old">4,500</div>
          <div class="more">+750 more</div>
        </div>
        <div class="price">$49.99</div>
      </div>
    </div>
  </div>
</div>

<!-- PICKER MODAL -->
<div class="send-picker-modal" id="sendPickerModal">
  <div class="send-top">
    <div class="send-title">Send Robux</div>
    <div class="send-top-right">
      <div class="send-balance" id="pickerBalanceContainer">
        <span id="pickerIcon">⏺</span>
        <span id="pickerBalance">1859403</span>
      </div>
      <div class="send-close" onclick="closeAllSendUI()">×</div>
    </div>
  </div>
  <div class="picker-content">
    <input type="text" id="userSearch" class="picker-search" placeholder="Search by username">
    <div class="search-results" id="searchResultsList"></div>
    <div class="friends-title">My Friends (<span id="friendCount">0</span>)</div>
    <div class="picker-friends" id="pickerFriendsList"></div>
  </div>
</div>

<!-- BLACK SEND SCREEN -->
<div class="send-black-screen" id="blackSendScreen">
  <div class="black-container" id="blackContainer"></div>
</div>
