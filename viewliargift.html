<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Send Robux UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#111827;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* OPEN BUTTON */

.open-btn{
  background:#3156f5;
  color:white;
  border:none;
  padding:16px 28px;
  border-radius:18px;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
}

/* POPUP */

.send-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:flex-start;
  justify-content:center;
  z-index:9999;
  padding-top:20px;
  backdrop-filter:blur(4px);
}

.send-popup.show{
  display:flex;
}

.send-popup-box{
  width:95%;
  max-width:960px;
  background:#f3f4f6;
  border-radius:32px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  overflow:hidden;
}

/* TOP */

.popup-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:26px;
}

.popup-title-wrap{
  display:flex;
  align-items:center;
  gap:14px;
}

.popup-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.popup-icon img{
  width:30px;
}

.popup-title{
  font-size:38px;
  font-weight:900;
  color:#1f2937;
  letter-spacing:-1px;
}

.popup-right{
  display:flex;
  align-items:center;
  gap:18px;
}

.popup-balance{
  display:flex;
  align-items:center;
  gap:8px;
  background:white;
  padding:10px 18px;
  border-radius:999px;
  font-size:26px;
  font-weight:900;
  color:#111827;
}

.popup-balance img{
  width:28px;
}

.close-popup{
  border:none;
  background:none;
  font-size:42px;
  color:#4b5563;
  cursor:pointer;
}

/* SEARCH */

.user-search{
  width:100%;
  height:96px;
  border:5px solid #3156f5;
  border-radius:28px;
  background:white;
  padding:0 28px;
  font-size:42px;
  font-weight:700;
  outline:none;
  color:#111827;
  margin-bottom:34px;
}

.user-search::placeholder{
  color:#6b7280;
  font-weight:500;
}

/* TITLE */

.friends-title{
  font-size:48px;
  font-weight:900;
  color:#374151;
  margin-bottom:26px;
  letter-spacing:-1px;
}

/* FRIENDS */

.search-results{
  max-height:520px;
  overflow-y:auto;
}

.search-user{
  display:flex;
  align-items:center;
  gap:20px;
  padding:18px 14px;
  border-radius:24px;
  transition:.12s;
  cursor:pointer;
}

.search-user:hover{
  background:white;
}

.search-user img{
  width:72px;
  height:72px;
  border-radius:18px;
  object-fit:cover;
  background:#ddd;
}

.user-display{
  font-size:34px;
  font-weight:700;
  color:#111827;
  line-height:1;
}

/* SEND SCREEN */

.send-screen{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:20000;
  padding:20px;
}

.send-screen.show{
  display:flex;
}

.selected-avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #3156f5;
  margin-bottom:20px;
}

.selected-name{
  color:white;
  font-size:42px;
  font-weight:900;
  margin-bottom:30px;
}

.amount-display{
  background:#1f2937;
  color:#ffd966;
  padding:18px 40px;
  border-radius:999px;
  font-size:48px;
  font-weight:900;
  margin-bottom:30px;
}

.amount-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  width:100%;
  max-width:420px;
  margin-bottom:20px;
}

.amount-btn{
  height:80px;
  border:none;
  border-radius:20px;
  background:#1f2937;
  color:white;
  font-size:28px;
  font-weight:900;
  cursor:pointer;
}

.amount-btn.active{
  background:#3156f5;
}

.custom-input{
  width:100%;
  max-width:420px;
  height:74px;
  border:none;
  border-radius:20px;
  background:#1f2937;
  color:white;
  font-size:28px;
  text-align:center;
  margin-bottom:20px;
}

.send-final{
  width:100%;
  max-width:420px;
  height:78px;
  border:none;
  border-radius:20px;
  background:#3156f5;
  color:white;
  font-size:28px;
  font-weight:900;
  cursor:pointer;
}

.success{
  color:#10b981;
  font-size:54px;
  font-weight:900;
  margin-top:30px;
}

/* MOBILE */

@media(max-width:700px){

  .send-popup-box{
    width:100%;
    height:100%;
    max-width:none;
    border-radius:0;
    padding:20px;
  }

  .popup-title{
    font-size:26px;
  }

  .popup-balance{
    font-size:18px;
    padding:8px 14px;
  }

  .user-search{
    height:74px;
    font-size:22px;
    border-width:4px;
    border-radius:22px;
  }

  .friends-title{
    font-size:26px;
  }

  .search-user{
    padding:14px 8px;
    gap:14px;
  }

  .search-user img{
    width:52px;
    height:52px;
    border-radius:14px;
  }

  .user-display{
    font-size:18px;
  }

  .selected-name{
    font-size:30px;
  }

}

</style>
</head>
<body>

<button class="open-btn" id="openPopup">
Send Robux
</button>

<!-- POPUP -->

<div class="send-popup" id="sendPopup">

  <div class="send-popup-box">

    <div class="popup-top">

      <div class="popup-title-wrap">

        <div class="popup-icon">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Robux_2019_Logo_gold.svg">
        </div>

        <div class="popup-title">
          Send Robux
        </div>

      </div>

      <div class="popup-right">

        <div class="popup-balance">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Robux_2019_Logo_gold.svg">
          <span id="balanceText">500</span>
        </div>

        <button class="close-popup" id="closePopup">
          ✕
        </button>

      </div>

    </div>

    <input
      type="text"
      class="user-search"
      id="searchInput"
      placeholder="Search by username"
    >

    <div class="friends-title">
      My friends (6)
    </div>

    <div class="search-results" id="results">

    </div>

  </div>

</div>

<!-- SEND SCREEN -->

<div class="send-screen" id="sendScreen">

  <img id="selectedAvatar" class="selected-avatar">

  <div id="selectedName" class="selected-name">
    Username
  </div>

  <div class="amount-display" id="amountDisplay">
    0
  </div>

  <div class="amount-grid">

    <button class="amount-btn" data-amount="25">25</button>
    <button class="amount-btn" data-amount="50">50</button>
    <button class="amount-btn" data-amount="100">100</button>
    <button class="amount-btn" data-amount="500">500</button>

  </div>

  <input
    type="number"
    class="custom-input"
    id="customInput"
    placeholder="Custom amount"
  >

  <button class="send-final" id="sendFinal">
    Send
  </button>

  <div class="success" id="successText"></div>

</div>

<script>

/* FRIEND DATA */

const friends = [

{
  name:"Talyren",
  avatar:"https://tr.rbxcdn.com/30DAY-AvatarHeadshot-3108E34E89B5C5179D8C2B7D1E3E6E2F-Png/150/150/AvatarHeadshot/Png/noFilter"
},

{
  name:"ItsPawan",
  avatar:"https://tr.rbxcdn.com/180DAY-742C4A5B0CC6B2DDEEC5E0B7F5831825-Png/150/150/AvatarHeadshot/Png/noFilter"
},

{
  name:"Yunglava_yt",
  avatar:"https://tr.rbxcdn.com/180DAY-BE5F9172D3E3B0C87F785F03C7E9876F-Png/150/150/AvatarHeadshot/Png/noFilter"
},

{
  name:"MinhKillerX",
  avatar:"https://tr.rbxcdn.com/180DAY-4F4D9A55D54BFA8C65C1D57B6B1D40B5-Png/150/150/AvatarHeadshot/Png/noFilter"
},

{
  name:"PANOS16",
  avatar:"https://tr.rbxcdn.com/180DAY-1D5CCDA9C4A98B9B68F48E3B6E91EF23-Png/150/150/AvatarHeadshot/Png/noFilter"
},

{
  name:"kez",
  avatar:"https://tr.rbxcdn.com/180DAY-1D5CCDA9C4A98B9B68F48E3B6E91EF23-Png/150/150/AvatarHeadshot/Png/noFilter"
}

];

/* ELEMENTS */

const popup = document.getElementById("sendPopup");
const openPopup = document.getElementById("openPopup");
const closePopup = document.getElementById("closePopup");
const results = document.getElementById("results");
const searchInput = document.getElementById("searchInput");

const sendScreen = document.getElementById("sendScreen");
const selectedAvatar = document.getElementById("selectedAvatar");
const selectedName = document.getElementById("selectedName");

const amountDisplay = document.getElementById("amountDisplay");
const customInput = document.getElementById("customInput");

const sendFinal = document.getElementById("sendFinal");
const successText = document.getElementById("successText");

let selectedUser = null;
let selectedAmount = 0;

/* OPEN/CLOSE */

openPopup.onclick = () => {
  popup.classList.add("show");
};

closePopup.onclick = () => {
  popup.classList.remove("show");
};

popup.addEventListener("click",(e)=>{
  if(e.target===popup){
    popup.classList.remove("show");
  }
});

/* RENDER USERS */

function renderUsers(list){

  results.innerHTML = "";

  list.forEach(user=>{

    const div = document.createElement("div");

    div.className = "search-user";

    div.innerHTML = `
      <img src="${user.avatar}">
      <div class="user-display">${user.name}</div>
    `;

    div.onclick = ()=>{

      selectedUser = user;

      popup.classList.remove("show");

      sendScreen.classList.add("show");

      selectedAvatar.src = user.avatar;
      selectedName.innerText = user.name;

    };

    results.appendChild(div);

  });

}

renderUsers(friends);

/* SEARCH */

searchInput.addEventListener("input",()=>{

  const value = searchInput.value.toLowerCase();

  const filtered = friends.filter(f=>
    f.name.toLowerCase().includes(value)
  );

  renderUsers(filtered);

});

/* AMOUNTS */

document.querySelectorAll(".amount-btn").forEach(btn=>{

  btn.onclick = ()=>{

    document.querySelectorAll(".amount-btn").forEach(b=>{
      b.classList.remove("active");
    });

    btn.classList.add("active");

    selectedAmount = Number(btn.dataset.amount);

    amountDisplay.innerText = selectedAmount;

    customInput.value = "";

  };

});

/* CUSTOM */

customInput.addEventListener("input",()=>{

  selectedAmount = Number(customInput.value);

  amountDisplay.innerText = selectedAmount || 0;

  document.querySelectorAll(".amount-btn").forEach(b=>{
    b.classList.remove("active");
  });

});

/* SEND */

sendFinal.onclick = ()=>{

  if(selectedAmount <= 0){
    alert("Enter an amount");
    return;
  }

  successText.innerText = `Sent ${selectedAmount} Robux!`;

  setTimeout(()=>{

    sendScreen.classList.remove("show");

    successText.innerText = "";

    selectedAmount = 0;

    amountDisplay.innerText = "0";

    customInput.value = "";

  },2500);

};

</script>

</body>
</html>
