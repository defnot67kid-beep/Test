<script>

function forceFullscreen(){

const elem=document.documentElement;

if(elem.requestFullscreen){

elem.requestFullscreen();

}

}

document.getElementById("fullscreenBtn")
.addEventListener("click",forceFullscreen);

const balanceDisplay=document.getElementById("balanceNumber");
const popupBalance=document.getElementById("popupBalance");

function getCurrentBalance(){

return parseInt(balanceDisplay.innerText)||0;

}

function setBalance(num){

num=Math.max(0,num);

balanceDisplay.innerText=num;
popupBalance.innerText=num;

localStorage.setItem("rbxBalance",num);

}

const saved=localStorage.getItem("rbxBalance");

if(saved){

setBalance(parseInt(saved));

}

document.getElementById("updateRobuxBtn")
.addEventListener("click",()=>{

const value=parseInt(
document.getElementById("robuxValueInput").value
);

if(!isNaN(value)){

setBalance(value);

}

});

const toast=document.getElementById("purchaseToast");

function showToast(msg){

toast.innerText=msg;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},2500);

}

document.querySelectorAll(".purchase-package")
.forEach(btn=>{

btn.addEventListener("click",()=>{

const cost=parseInt(btn.dataset.cost);

const balance=getCurrentBalance();

if(balance>=cost){

setBalance(balance-cost);

showToast(`Purchased -${cost} Robux`);

}else{

showToast("❌ Not enough Robux");

}

});

});

const sendPopup=document.getElementById("sendPopup");

document.getElementById("sendBtn")
.addEventListener("click",()=>{

sendPopup.classList.add("show");

});

document.getElementById("closePopup")
.addEventListener("click",()=>{

sendPopup.classList.remove("show");

});

let currentMode="username";

const modeUsername=document.getElementById("modeUsername");
const modeUserID=document.getElementById("modeUserID");

modeUsername.addEventListener("click",()=>{

currentMode="username";

modeUsername.classList.add("active-mode");
modeUserID.classList.remove("active-mode");

});

modeUserID.addEventListener("click",()=>{

currentMode="userid";

modeUserID.classList.add("active-mode");
modeUsername.classList.remove("active-mode");

});

const searchInput=document.getElementById("userSearchInput");
const resultsDiv=document.getElementById("searchResults");

async function triggerSearch(){

const query=searchInput.value.trim();

if(!query)return;

resultsDiv.innerHTML=`
<div class="loading">
🔎 Searching...
</div>
`;

try{

let users=[];

if(currentMode==="username"){

const res=await fetch(
`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(query)}&limit=25`
);

const data=await res.json();

users=data.data||[];

}else{

const res=await fetch(
`https://users.roblox.com/v1/users/${query}`
);

const user=await res.json();

users=[user];

}

if(users.length===0){

resultsDiv.innerHTML=`
<div class="no-results">
No users found
</div>
`;

return;

}

resultsDiv.innerHTML="";

users.forEach(user=>{

const avatar=
`https://www.roblox.com/headshot-thumbnail/image?userId=${user.id}&width=150&height=150&format=png`;

const div=document.createElement("div");

div.className="search-user";

div.innerHTML=`
<img src="${avatar}">
<div>
<div class="user-display">
${user.displayName||user.name}
</div>
<div class="user-username">
@${user.name}
</div>
<div class="user-id-badge">
ID: ${user.id}
</div>
</div>
`;

div.addEventListener("click",()=>{

openBlackScreen(user,avatar);

});

resultsDiv.appendChild(div);

});

}catch(err){

resultsDiv.innerHTML=`
<div class="no-results">
❌ Error loading users
</div>
`;

}

}

let debounce;

searchInput.addEventListener("input",()=>{

clearTimeout(debounce);

debounce=setTimeout(triggerSearch,400);

});

const sendBlackScreen=document.getElementById("sendBlackScreen");

const selectedPlayerAvatar=document.getElementById("selectedPlayerAvatar");

const selectedPlayerName=document.getElementById("selectedPlayerName");

const selectedAmountDisplay=document.getElementById("selectedAmountDisplay");

let currentSelectedAmount=0;
let currentSelectedUser=null;

function openBlackScreen(user,avatar){

currentSelectedUser=user;

selectedPlayerAvatar.src=avatar;

selectedPlayerName.innerText=user.name;

selectedAmountDisplay.innerText="0";

currentSelectedAmount=0;

document.querySelectorAll(".amount-option")
.forEach(btn=>btn.classList.remove("active"));

sendPopup.classList.remove("show");

sendBlackScreen.classList.add("show");

}

document.querySelectorAll(".amount-option")
.forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".amount-option")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

currentSelectedAmount=parseInt(btn.dataset.amount);

selectedAmountDisplay.innerText=currentSelectedAmount;

});

});

// ========== PROCESSING & SENT SCREEN (from the script) ==========

function fakeProcessing(callback){

const nextBtn=document.getElementById("nextBtn");

const original=nextBtn.innerHTML;

nextBtn.disabled=true;

let dots=0;

const interval=setInterval(()=>{

dots=(dots+1)%4;

nextBtn.innerHTML=
"Processing"+".".repeat(dots);

},400);

setTimeout(()=>{

clearInterval(interval);

nextBtn.innerHTML=original;

nextBtn.disabled=false;

callback();

},2500);

}

// Replace black screen content with "Sent!" confirmation screen
